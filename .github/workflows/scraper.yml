name: Nightly scraper

on:
  schedule:
    - cron: "5 22 * * *"   # daily at 22:05 UTC (01:05 Israel summer / 00:05 Israel winter)
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        city: [tel_aviv, jerusalem, haifa, beer_sheva]

    env:
      SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scraper/requirements.txt
          .venv/bin/pip install -r requirements.txt

      - name: Install Playwright browsers
        run: .venv/bin/python -m playwright install chromium

      - name: Scrape ${{ matrix.city }}
        run: caffeinate -dims .venv/bin/python scraper/run.py --playwright --city ${{ matrix.city }}

      - name: Kill orphan Chromium processes
        if: always()
        run: pkill -f chromium || true
